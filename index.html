<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deal Files">
<meta name="theme-color" content="#eb0a1e">
<title>Planet Toyota - Deal Files</title>
<style>
:root{--red:#eb0a1e;--ink:#1c1c1e;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--ok:#15803d;--okbg:#dcfce7;--pd:#b45309;--pdbg:#fef3c7}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid #cfd3da;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}
input:disabled,select:disabled{background:#f1f2f4;color:#4b5563}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
label input,label select{margin-top:3px;font-size:15px}
label.ck{font-size:15px;color:var(--ink);margin-bottom:6px}
.hide{display:none!important}
#login{max-width:320px;margin:18vh auto 0;padding:24px;background:#fff;border-radius:14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#login h1{font-size:20px;margin:0 0 4px}#login p{color:var(--mut);margin:0 0 16px}
#login input{text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:12px}
#login button{width:100%}
header{background:var(--red);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.85;font-weight:400}
header button{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:6px 9px}
header button.new{background:#fff;color:var(--red);font-weight:700}
#main{display:grid;grid-template-columns:1fr;height:calc(100% - 52px)}
#left{overflow:auto;padding:10px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
#tabs button{white-space:nowrap;padding:6px 10px;font-size:13px}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tabs i{font-style:normal;opacity:.7;margin-left:4px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .nm{font-weight:600}.item .sub{color:var(--mut);font-size:13px}
.age{font-size:12px;color:var(--mut);white-space:nowrap}.age.old{color:var(--red);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--pdbg);color:var(--pd);font-weight:400}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.na{background:#eef0f3;color:var(--mut)}
#right{background:var(--bg);overflow:auto;padding:10px;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3,.card summary{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.card h3{margin-bottom:10px;cursor:default}
details.card[open] summary{margin-bottom:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mut);font-size:18px;margin-left:auto}
details[open]>summary::after{content:"–"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--mut);font-size:13px}
.doc{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-of-type{border-top:0}
.doc .t{flex:1;min-width:120px}.doc .miss{color:var(--red);font-size:12px;font-weight:600}
.doc button{padding:4px 9px;font-size:13px}
.claim{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.sum{background:#f8f9fb;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;line-height:1.7}
.sum b{white-space:nowrap}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%;text-align:center}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:25;display:flex;align-items:center;justify-content:center;font-weight:600}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewer img{max-width:100%;max-height:82vh;border-radius:6px}
#viewer a{color:#fff;font-size:17px}
#stockBox{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:flex;justify-content:center;align-items:flex-end}
#stockBox .sheet{background:#fff;width:100%;max-width:720px;height:88vh;border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:8px}
#stockBox .shead{display:flex;justify-content:space-between;align-items:center}
#stockL{overflow:auto;flex:1}
.st{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.st div{flex:1;min-width:0}.st .sub{color:var(--mut);font-size:12px;word-break:break-all}
@media (max-width:899px){
  #right{position:fixed;inset:0;top:calc(52px + env(safe-area-inset-top));z-index:4;display:none}
  #right.open{display:block}
}
@media (min-width:900px){
  #main{grid-template-columns:390px 1fr}
  #left{border-right:1px solid var(--line)}
  .back{display:none}
  .grid{grid-template-columns:1fr 1fr 1fr}
  #stockBox{align-items:center}#stockBox .sheet{border-radius:14px;height:80vh}
}

/* ---------- printed forms ---------- */
#print{display:none}
.pg{width:210mm;height:296mm;padding:11mm 13mm;position:relative;overflow:hidden;page-break-after:always;background:#fff;color:#000;font:10.5pt/1.4 Arial,"Nirmala UI","Noto Sans Devanagari",sans-serif}
.pg.img{padding:6mm}
.pg h1{font-size:14pt;text-align:center;margin:3mm 0 4mm;text-decoration:underline}
.pg h4{font-size:10.5pt;margin:3mm 0 1.5mm}
.pg p{margin:0 0 2.2mm}
.ov{position:relative;width:198mm}.ov img{width:100%;display:block}
.ov span{position:absolute;font:8.5pt/1 Arial,sans-serif;white-space:nowrap;transform:translateY(-55%)}
.lh{text-align:center;border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:2mm;line-height:1.3}
.lh .n{font:700 20pt Georgia,"Times New Roman",serif;letter-spacing:.5px}
.fl{display:inline-block;border-bottom:1px dotted #000;min-width:30mm;padding:0 1.5mm;font-weight:700;vertical-align:bottom;min-height:1.3em}
.ln{display:flex;gap:2mm;align-items:flex-end;margin-bottom:4.2mm}.ln .fl{flex:1}
.box{display:inline-block;width:9mm;height:5mm;border:1px solid #000;vertical-align:middle;text-align:center;line-height:5mm;font-weight:700;margin:0 6mm 0 2mm}
.pg table{border-collapse:collapse;width:100%}
.pg td,.pg th{border:1px solid #000;padding:.9mm 1.5mm;font-size:8.8pt;height:5.6mm}
.bo td{height:5.05mm;padding:.4mm 1.5mm;font-size:8.3pt}.bo td:nth-child(odd){text-align:center;width:23%;white-space:nowrap}.bo td:nth-child(even){font-weight:700;width:27%}
.bo .hd{font-weight:700;text-decoration:underline;text-align:center}
.kv.big td{font-size:10.5pt;height:8mm}.kv td:nth-child(odd){width:20%;background:#f2f2f2}.kv td:nth-child(even){width:30%;font-weight:700}
.sig{display:flex;justify-content:space-between;gap:8mm;position:absolute;left:13mm;right:13mm;bottom:14mm;font-size:9.5pt}.sig.flow{position:static;margin-top:15mm}
.sig div{flex:1;border-top:1px solid #000;padding-top:1.5mm;text-align:center}
.hi{font-size:10.5pt;line-height:1.75}.hi p{margin-bottom:2.6mm;text-align:justify}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
</style>
</head>
<body>

<div id="login">
  <h1>Planet Toyota</h1><p>Deal Files</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <button class="pri" id="loginBtn">Login</button>
</div>

<div id="app" class="hide">
  <header>
    <b>Deal Files <small id="who"></small></b>
    <button class="new" id="newBtn">+ New</button>
    <button id="stockBtn">Stock</button>
    <button id="refBtn">Refresh</button>
    <button id="outBtn">Logout</button>
  </header>
  <div id="main">
    <div id="left">
      <div id="tabs"></div>
      <div class="filters">
        <input id="q" placeholder="Search name, mobile, chassis, file no.">
        <select id="seF" style="max-width:150px"></select>
      </div>
      <div id="list"></div>
    </div>
    <div id="right"><div class="empty">Select a file</div></div>
  </div>
</div>

<input type="file" id="fileIn" accept="image/*,application/pdf" class="hide">
<datalist id="models"><option>Glanza<option>Urban Cruiser Taisor<option>Rumion<option>Urban Cruiser Hyryder<option>Innova Crysta<option>Innova Hycross<option>Fortuner<option>Legender<option>Hilux<option>Camry<option>Vellfire<option>Land Cruiser 300</datalist>
<datalist id="ctypes"><option>Exchange bonus<option>Loyalty bonus<option>Corporate discount<option>Consumer offer<option>Other</datalist>
<div id="viewer" class="hide"></div>
<div id="stockBox" class="hide"><div class="sheet">
  <div class="shead"><b id="stockT">Stock</b><button id="stockX">Close</button></div>
  <input id="stockQ" placeholder="Search model, variant, colour, chassis">
  <div id="stockL"></div>
</div></div>
<div id="busy" class="hide">Please wait…</div>
<div id="toast" class="hide"></div>
<div id="print"></div>

let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hide'),4000); }
function busy(on){ $('busy').classList.toggle('hide',!on); }

/* ---------- transport ---------- */
function jsonp(action, data){
  return new Promise((res, rej) => {
    const cb = 'cb' + Date.now() + Math.floor(Math.random()*1e6), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('Server did not respond')); }, 45000);
    window[cb] = r => { done(); r && r.ok ? res(r) : rej(new Error((r && r.error) || 'Error')); };
    s.onerror = () => { done(); rej(new Error('Network error')); };
    s.src = API + '?action=' + action + '&callback=' + cb + '&nonce=' + Date.now() +
      '&payload=' + encodeURIComponent(JSON.stringify(Object.assign({pin: PIN}, data || {})));
    document.body.appendChild(s);
  });
}
async function post(action, data){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, pin: PIN}, data))});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}
async function run(fn){ busy(true); try { return await fn(); } catch(e){ toast(e.message); } finally { busy(false); } }

function reqDocs(d){ const r=['Aadhaar','PAN / Form 60','Booking form']; if(d.PayType==='Finance')r.push('Finance DO'); if(d.Exchange==='Yes')r.push('Old vehicle RC'); return r; }
const docsOf = id => DB.docs.filter(x => x.DealID === id);
const claimsOf = id => DB.claims.filter(x => x.DealID === id);
const paysOf = id => DB.payments.filter(x => x.DealID === id);
function missing(d){ const have=new Set(docsOf(d.DealID).map(x=>x.Type)); return reqDocs(d).filter(t=>!have.has(t)); }
const openClaims = d => claimsOf(d.DealID).filter(c => c.Status !== 'Received' && c.Status !== 'Rejected').length;
function done(d){ return {docs: !missing(d).length && d.DocsVerified==='Yes', bill: !!d.InvoiceNo, ins: !!d.PolicyNo, rto: !!d.RegNo, del: !!d.DeliveryDate, file: !!d.FileReceivedAt,
  ew: d.EW==='Yes' ? !!d.EWNo : null, acc: d.Accessories==='Yes' ? !!d.AccInvoiceNo : null, tg: d.TGloss==='Yes' ? !!d.TGlossNo : null}; }
function inTab(d, t){
  const open = d.Status === 'Open', x = done(d);
  if (t === 'closed') return !open;
  if (!open) return false;
  if (t === 'all') return true;
  if (t === 'file') return x.del && !x.file;
  if (t === 'claims') return openClaims(d) > 0;
  return x[t] === false;
}
function age(d){ const s=(d.BookingDate||d.CreatedAt||'').slice(0,10); const n=Math.floor((Date.now()-new Date(s).getTime())/864e5); return isNaN(n)?0:Math.max(0,n); }
function canEdit(k, d){
  if (d.Status !== 'Open' && !isBack() && !isVas()) return false;
  if (SALES_F.includes(k)) return U.role !== 'SE' || d.SE === U.name;
  if (ALLOT_F.includes(k)) return U.role !== 'CLAIMS' && (U.role !== 'SE' || d.SE === U.name);
  if (VAS_F.includes(k)) return isVas();
  return isBack();
}
// Money: invoice = ex-showroom - discounts; total = invoice + all charges; balance = total - loan - old car; net = balance - payments.
function calc(d){
  const disc = num(d.ConsumerScheme) + num(d.ExchangeDisc) + num(d.CorporateDisc) + num(d.OtherDisc);
  const inv = num(d.ExShowroom) - disc;
  const charges = ['TCS','EPC','EWAmt','InsAmt','RegCharges','AccAmt','TGlossAmt','Fastag','HSRPGarnish','TsmileAmt','OtherCharges'].reduce((a,k) => a + num(d[k]), 0);
  const total = inv + charges, balance = total - num(d.LoanAmt) - num(d.OldCarValue);
  const paid = paysOf(d.DealID).reduce((a,p) => a + num(p.Amount), 0);
  return {disc, inv, charges, total, balance, paid, net: balance - paid};
}

function visible(){
  const q = $('q').value.trim().toLowerCase(), se = $('seF').value;
  return DB.deals.filter(d => inTab(d, tab) && (!se || d.SE === se) &&
    (!q || [d.Customer,d.Mobile,d.Chassis,d.DealID,d.RegNo,d.Model].join(' ').toLowerCase().includes(q)))
    .sort((a,b) => age(b) - age(a));
}
function render(){
  const se = $('seF').value;
  $('tabs').innerHTML = TABS.map(([k,t]) => `<button data-tab="${k}" class="${k===tab?'on':''}">${t}<i>${DB.deals.filter(d=>inTab(d,k)&&(!se||d.SE===se)).length}</i></button>`).join('');
  const rows = visible();
  $('list').innerHTML = rows.length ? rows.map(d => {
    const x = done(d), a = age(d), cl = claimsOf(d.DealID), oc = openClaims(d);
    const chips = CHIPS.map(([k,t]) => {
      const c = k==='claims' ? (!cl.length ? 'na' : oc ? '' : 'ok') : (x[k] == null ? 'na' : x[k] ? 'ok' : '');
      return `<span class="chip ${c}">${t}</span>`;
    }).join('');

      <div class="sub">${esc(d.Model)} ${esc(d.Variant)} · ${esc(d.SE)} · ${esc(d.DealID)}</div>
      <div class="chips">${chips}</div></div>`;
  }).join('') : '<div class="empty">No files here</div>';
  renderDetail();
}
function field(d, f, edit){
  const [k, type, opt] = f, v = d[k] || '', dis = edit ? '' : 'disabled';
  const inp = type === 'select'
    ? `<select data-k="${k}" ${dis}>${[''].concat(opt).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`
    : `<input data-k="${k}" type="${type}" value="${esc(v)}" ${opt?`list="${opt}"`:''} ${dis}>`;
  return `<label>${L[k]}${inp}</label>`;
}
const card = (k, title, body) => `<details class="card" data-sec="${k}" ${openSecs.has(k)?'open':''}><summary>${title}</summary>${body}</details>`;
function renderDetail(){
  const R = $('right'), d = DB.deals.find(x => x.DealID === cur);
  if (!d) { R.classList.remove('open'); R.innerHTML = '<div class="empty">Select a file</div>'; return; }
  R.classList.add('open');
  const open = d.Status === 'Open', top = R.scrollTop;
  let h = `<div class="dhead"><button class="back" data-act="back">‹ Back</button><div>
    <h2>${esc(d.Customer)}</h2><div class="sub">${esc(d.DealID)} · ${esc(d.SE)} · ${esc(d.Status)} · opened ${esc(d.CreatedAt)}</div></div></div>`;
  h += card('print', 'Print forms', FORMS.map(([k,t,on]) => `<label class="ck"><input type="checkbox" data-form="${k}" ${on?'checked':''}>${t}</label>`).join('') +
    `<button class="pri" data-act="print">Print selected forms</button>`);
  SECTIONS.forEach(s => {
    if (s.k === 'docs') { h += docsHtml(d); return; }
    if (s.k === 'claims') { h += claimsHtml(d); return; }
    if (s.k === 'pay') { h += paysHtml(d); return; }
    const any = s.f.some(f => canEdit(f[0], d));
    let body = '';
    if (s.sum) { const c = calc(d); body += `<div class="sum">Invoice <b>₹${inr(c.inv)||0}</b> · Total <b>₹${inr(c.total)||0}</b> · Balance after loan and old car <b>₹${inr(c.balance)||0}</b> · Received <b>₹${inr(c.paid)||0}</b> · Net balance <b>₹${inr(c.net)||0}</b></div>`; }
    if (s.k === 'bill' && canEdit('Chassis', d)) body += '<p><button data-act="stock">Pick chassis from stock</button></p>';
    body += `<div class="grid">${s.f.map(f => field(d, f, canEdit(f[0], d))).join('')}</div>`;
    if (any) body += `<button class="pri" data-act="save">Save</button>`;
    h += card(s.k, s.t, body);
  });
  if (isBack()) {
    h += `<div class="card"><h3>File status</h3>` + (open
      ? `<button data-act="status" data-v="Closed">Close file</button> <button data-act="status" data-v="Cancelled">Cancel booking</button>`
      : `<button data-act="status" data-v="Open">Reopen file</button>`) + `</div>`;
  }
  R.innerHTML = h;
  R.scrollTop = top;
}
function docsHtml(d){
  const docs = docsOf(d.DealID), req = reqDocs(d), miss = missing(d);
  const canUp = d.Status === 'Open' && (U.role !== 'SE' || d.SE === U.name);
  const types = DOC_TYPES.concat([...new Set(docs.map(x=>x.Type))].filter(t=>!DOC_TYPES.includes(t)));
  const rows = types.map(t => {
    const have = docs.filter(x => x.Type === t);
    const st = have.length ? have.map((x,i)=>`<button data-act="view" data-doc="${esc(x.DocID)}" title="${esc(x.By)} · ${esc(x.At)}">View${have.length>1?' '+(i+1):''}</button>`).join('')
      : (req.includes(t) ? '<span class="miss">Missing</span>' : '');
    return `<div class="doc"><span class="t">${esc(t)}${req.includes(t)?' *':''}</span>${st}${canUp?`<button data-act="upload" data-type="${esc(t)}">${have.length?'Add':'Upload'}</button>`:''}</div>`;
  }).join('');
  const ver = d.DocsVerified === 'Yes';
  let foot = ver ? `<p class="mut">Verified by ${esc(d.DocsVerifiedBy)}</p>` : '';
  if (isBack() && d.Status === 'Open') foot += ver
    ? `<button data-act="verify" data-v="">Undo verification</button>`
    : `<button class="pri" data-act="verify" data-v="Yes" ${miss.length?'disabled':''}>Mark documents verified</button>`;
  return card('docs', `Documents <span class="chip ${ver&&!miss.length?'ok':''}">${miss.length?miss.length+' missing':ver?'Verified':'To verify'}</span>`, rows + `<div style="margin-top:10px">${foot}</div>`);
}
function claimsHtml(d){

    ${bk?`<button class="pri" data-act="saveClaim" data-cid="${esc(c.ClaimID)}">Save claim</button>`:''}</div>`).join('');
  return card('claims', `TKM claims <span class="chip ${cl.length?(openClaims(d)?'':'ok'):'na'}">${cl.length}</span>`,
    (rows || '<p class="mut">No claims recorded.</p>') + (bk && d.Status === 'Open' ? `<p><button data-act="addClaim">+ Add claim</button></p>` : ''));

function paysHtml(d){
  const ps = paysOf(d.DealID), bk = isBack(), c = calc(d);
  const canAdd = d.Status === 'Open' && (U.role !== 'SE' || d.SE === U.name);

    o = o || {};

      <p>ग्राहक को अपनी गाड़ी का रजिस्ट्रेशन निर्धारित समय के अंदर अवश्य करवा लेना चाहिए ताकि इन्शोरेन्स इत्यादि के सभी लाभ प्राप्त हो सके। गाड़ी का रजिस्ट्रेशन निर्धारित समय तक नही करवाने से होने वाले नुकसान का प्लेनेट टोयोटा किसी प्रकार से जिम्मेवार नही होगा।</p>
      <p>गाड़ी के रजिस्ट्रेशन से संबंधित नियमों में किसी प्रकार के बदलाव होने पर प्लेनेट टोयोटा किसी प्रकार से जिम्मेवार नही होगा।</p>
      <p>मैने गाड़ी पर मिलने वाली वारन्टी की शर्तें अच्छी तरह से समझ ली है व मुझे बता दिया गया है कि भविष्य में गाड़ी में किसी प्रकार की खराबी आने पर वारन्टी की शर्तो अनुसार ही कार्य करवाउंगा।</p>
      <p>मेरी इन्शोरेन्स की पॉलिसी की सभी डिटेल व इन्फोरमेशन सही है व मैने इन्शोरेन्स की शर्तें समझ ली है व यह जान लिया है कि इन्शोरेन्स का क्लेम इन्शोरेन्स कम्पनी की शर्तो अनुसार ही मिलेगा।</p>
      <p>मुझे यह बता दिया गया है कि किसी प्रकार की Non Genuine एसेसरीज या कोई अन्य फिटमैन्ट करवाने के कारण गाड़ी में यदि कोई नुकसान होता है तो उसका जिम्मेवार मैं स्वयं होउंगा।</p>
      <p>मेरा GST No. ${fl(d.GSTNo, 60)} है।</p>
      <p>मेरी इस गाड़ी का इन्शोरेन्स ${use} के हिसाब से किया जाए।</p>

      <div class="sig"><div>ग्राहक के हस्ताक्षर<br>${esc(d.Customer)}</div><div>सेल्स एग्जीक्यूटीव के हस्ताक्षर<br>${esc(d.SE)}</div></div></div>`;
  },

    const kv = rows => `<table class="kv">${rows.map(r => `<tr><td>${r[0]}</td><td${r.length === 2 ? ' colspan="3"' : ''}>${esc(r[1])}</td>${r.length > 2 ? `<td>${r[2]}</td><td>${esc(r[3])}</td>` : ''}</tr>`).join('')}</table>`;
    return `<div class="pg" style="font-size:9.3pt;line-height:1.3;padding-top:8mm">${LH}<h1 style="font-size:12pt;margin:2mm 0 2.5mm">CUSTOMER CONSENT FOR INSURANCE AND REGISTRATION (RTO)</h1>
      ${kv([['File No.', d.DealID, 'Date', fd(today())], ['Customer name', [d.Customer, d.Relation].filter(Boolean).join(' ')], ['Address', addr(d)],
        ['Mobile', d.Mobile, 'Date of birth', fd(d.DOB)], ['PAN', d.PAN, 'Email', d.Email],

      <h4>A. Insurance</h4>

      <p style="margin-top:2mm">1. I request and authorise Planet Toyota to arrange the insurance of the above vehicle in my name, with the insurance company and type of cover stated above.</p>
      <p>2. The cover, add-ons, insured value (IDV), premium and exclusions have been explained to me in a language I understand, and I agree to them.</p>
      <p>3. The name, address, nominee, vehicle use (${com ? 'commercial' : 'personal'}) and hypothecation stated above are correct. I understand that any claim will be settled by the insurance company as per the policy terms, and that a wrong declaration of vehicle use can lead to rejection of a claim.</p>
      <h4>B. Registration (RTO)</h4>
      ${kv([['Registering authority', d.RTOOffice, 'Registration type', d.Usage ? (com ? 'Commercial (yellow plate)' : 'Private (white plate)') : ''], ['To be registered in the name of', d.Customer, 'Registration charges (₹)', inr(d.RegCharges)], ['Hypothecation to be endorsed', hyp]])}
      <p style="margin-top:2mm">4. I authorise Planet Toyota to apply on my behalf for registration of the above vehicle, including submission of Form 20 and other required documents, payment of road tax and fees, and fitment of the High Security Registration Plate (HSRP).</p>
      <p>5. The vehicle is to be registered in the name and at the address stated above. The identity and address proofs given by me are genuine and belong to me.</p>
      <p>6. I understand that road tax and registration fees are charged as per government rules applicable on the date of registration. Any difference from the amount stated above will be payable by me or refunded to me.</p>
      <p>7. I understand that the vehicle will be delivered only after the registration number is allotted, and that Planet Toyota is not responsible for any delay at the registering authority or for a change in registration rules.</p>
      <h4>C. General</h4>
      <p>8. I consent to Planet Toyota using my KYC documents, mobile number and the OTPs received on it only for the insurance and registration of this vehicle.</p>
      <p>9. I have read this consent, or it has been read out and explained to me in Hindi, and I sign it of my own free will.</p>
      <div class="sig flow"><div>Customer signature<br>${esc(d.Customer)}</div><div>Sales Executive<br>${esc(d.SE)}</div><div>For Planet Toyota<br>&nbsp;</div></div></div>`;
  },
  sat(d){
    return `<div class="pg" style="font-size:11.5pt"><h1>CUSTOMER SATISFACTION NOTE</h1>
      <div class="ln" style="margin-top:8mm"><span>Dealer Name:-</span>${fl('Planet Toyota (Sanghi Autoplex Pvt. Ltd.)')}<span>Date:</span>${fl(fd(today()), 35)}</div>
      <div class="ln"><span>Location:-</span>${fl('Narnaul')}</div>
      <p style="margin-top:6mm"><b>Customer Concern:</b></p><div style="border:1px solid #000;height:38mm;margin-bottom:8mm"></div>
      <p>Dear ${fl('', 60)},</p>
      <p style="margin-top:5mm;line-height:1.9">With reference to my above-mentioned concerns in my vehicle, I would like to confirm that M/s ${fl('Planet Toyota, Narnaul', 60)} has addressed all my concerns to my complete satisfaction. There is no further complaint pending as on today.</p>
      <p style="margin-top:8mm"><b>Remarks / Feedback (if any)</b></p>
      ${[1, 2, 3].map(i => `<div class="ln"><span>${i}</span>${fl('')}</div>`).join('')}
      <table class="kv big" style="margin-top:8mm">${[['Customer Name', d.Customer], ['Contact No.', d.Mobile], ['Vehicle Model', veh(d)], ['Vehicle Regn. No.', d.RegNo]].map(r => `<tr><td style="width:35%">${r[0]}</td><td colspan="3">${esc(r[1])}</td></tr>`).join('')}
      <tr><td style="width:35%">Area of Concern</td><td colspan="3" style="font-weight:400">Sales <span class="box"></span> Service <span class="box"></span> Product <span class="box"></span></td></tr></table>
      <div style="margin:20mm 0 0 50%"><div class="ln"><span>Customer's Signature:</span>${fl('')}</div></div></div>`;
  }
};
async function printForms(d, keys){
  if (!keys.length) return toast('Select at least one form');
  const P = $('print');
  P.innerHTML = keys.map(k => FORM[k](d)).join('');
  await Promise.all([...P.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  window.print();
}

/* ---------- actions ---------- */
async function load(){
  const r = await jsonp('list');
  DB = {deals: r.deals, docs: r.docs, claims: r.claims, payments: r.payments || []};
  const ses = [...new Set(DB.deals.map(d => d.SE))].sort(), keep = $('seF').value;
  $('seF').innerHTML = '<option value="">All SEs</option>' + ses.map(s => `<option ${s===keep?'selected':''}>${esc(s)}</option>`).join('');
  $('seF').classList.toggle('hide', U.role === 'SE');
  render();
}
function putDeal(d){ const i = DB.deals.findIndex(x => x.DealID === d.DealID); if (i >= 0) DB.deals[i] = d; else DB.deals.push(d); }
function changed(box, base){
  const f = {};
  box.querySelectorAll('[data-k]').forEach(el => { if (!el.disabled && el.value.trim() !== (base[el.dataset.k] || '')) f[el.dataset.k] = el.value.trim(); });
  return f;
}
async function saveDeal(fields, msg){
  if (!Object.keys(fields).length) return toast('Nothing changed');
  await run(async () => { const r = await jsonp('updateDeal', {id: cur, fields}); putDeal(r.deal); render(); toast(msg || 'Saved'); });
}
async function login(pin){
  PIN = pin;
  await run(async () => {
    try { U = (await jsonp('login')).user; } catch (e) { PIN = ''; try { sessionStorage.removeItem('dfpin'); } catch (_) {} throw e; }
    try { sessionStorage.setItem('dfpin', pin); } catch (_) {}
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    $('who').textContent = '· ' + U.name;
    await load();
  });
}
function newDealForm(){
  cur = null; render();
  const blank = {BookingDate: today(), PayType: 'Cash', Exchange: 'No', EW: 'No', Accessories: 'No', TGloss: 'No', SE: U.name};
  const f = SECTIONS[0].f.slice();
  if (U.role !== 'SE') f.unshift(['SE','text']);
  const R = $('right');
  R.classList.add('open');
  R.innerHTML = `<div class="dhead"><button class="back" data-act="back">‹ Back</button><div><h2>New deal file</h2></div></div>
    <div class="card" id="newCard"><div class="grid">${f.map(x => field(blank, x, true)).join('')}</div>
    <button class="pri" data-act="create">Open file</button></div>`;
}
function prep(file){
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) {
      if (file.type !== 'application/pdf') return rej(new Error('Only photos and PDFs can be uploaded'));
      if (file.size > 4e6) return rej(new Error('PDF is larger than 4 MB'));
      const r = new FileReader();
      r.onload = () => res({mime: 'application/pdf', b64: r.result.split(',')[1]});
      r.onerror = () => rej(new Error('Could not read file'));
      return r.readAsDataURL(file);
    }
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res({mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.75).split(',')[1]});
    };
    img.onerror = () => rej(new Error('Could not read this photo'));
    img.src = u;
  });
}
async function doUpload(file){
  const id = cur, type = upType;
  await run(async () => {
    const p = await prep(file), before = docsOf(id).filter(x => x.Type === type).length;
    let err = null;
    try { await post('upload', {dealId: id, type, mime: p.mime, b64: p.b64}); } catch (e) { err = e; }
    await load();
    const after = docsOf(id).filter(x => x.Type === type).length;
    if (after > before) toast(type + ' uploaded'); else throw new Error('Upload failed' + (err ? ': ' + err.message : ''));
  });
}
async function viewDoc(docId){
  await run(async () => {
    const r = await jsonp('file', {docId});
    const bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: r.mime}));
    const V = $('viewer');
    V.innerHTML = (r.mime.startsWith('image/') ? `<img src="${url}" alt="">` : `<a href="${url}" target="_blank" rel="noopener">Open PDF: ${esc(r.name)}</a>`) + `<button data-close="1">Close</button>`;
    V.dataset.url = url; V.classList.remove('hide');
  });
}
function openStock(){ run(async () => { STOCK = (await jsonp('stock')).stock; $('stockQ').value = ''; renderStock(); $('stockBox').classList.remove('hide'); }); }
function renderStock(){
  const q = $('stockQ').value.trim().toLowerCase(), d = DB.deals.find(x => x.DealID === cur);
  const pick = d && d.Status === 'Open' && canEdit('Chassis', d);
  const rows = STOCK.map((s, i) => [s, i]).filter(([s]) => !q || [s.Model,s.Variant,s.Colour,s.Chassis,s.Suffix].join(' ').toLowerCase().includes(q));
  $('stockT').textContent = 'Uninvoiced stock: ' + rows.length + (pick ? ' · pick for ' + d.Customer : '');
  $('stockL').innerHTML = rows.map(([s, i]) => {
    const mine = d && s.Chassis === (d.Chassis || '').toUpperCase();
    const right = s.AllottedTo && !mine ? `<span class="chip">${esc(s.AllottedTo)}</span>` : mine ? '<span class="chip ok">This file</span>' : pick ? `<button class="pri" data-pick="${i}">Pick</button>` : '<span class="chip ok">Free</span>';
    return `<div class="st"><div><b>${esc(s.Variant || s.Model)}</b> · ${esc(s.Colour)}<div class="sub">${esc(s.Chassis)} · Eng ${esc(s.EngineNo)} · ${esc(s.Suffix)} · ${esc(s.MfgYear)} · TKM inv. ${esc(s.InvDate)}</div></div>${right}</div>`;
  }).join('') || '<div class="empty">No stock found</div>';
}

/* ---------- events ---------- */
$('loginBtn').onclick = () => { const p = $('pin').value.trim(); if (p) login(p); };
$('pin').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
$('outBtn').onclick = () => { try { sessionStorage.removeItem('dfpin'); } catch (_) {} location.reload(); };
$('refBtn').onclick = () => run(load);
$('newBtn').onclick = newDealForm;
$('stockBtn').onclick = openStock;
$('stockX').onclick = () => $('stockBox').classList.add('hide');
$('stockQ').oninput = renderStock;
$('stockL').onclick = e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  const s = STOCK[+b.dataset.pick];
  $('stockBox').classList.add('hide');
  saveDeal({Chassis: s.Chassis, EngineNo: s.EngineNo, Suffix: s.Suffix, MfgYear: s.MfgYear, Model: s.Model, Variant: s.Variant, Colour: s.Colour}, 'Chassis allotted');
};
$('q').oninput = render;
$('seF').onchange = render;
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; render(); } };
$('list').onclick = e => { const it = e.target.closest('.item'); if (it) { cur = it.dataset.id; $('right').scrollTop = 0; render(); } };
$('viewer').onclick = e => { if (e.target.dataset.close || e.target === $('viewer')) { URL.revokeObjectURL($('viewer').dataset.url); $('viewer').classList.add('hide'); $('viewer').innerHTML = ''; } };
$('fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) doUpload(f); };
$('right').addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.sec; if (k) { if (e.target.open) openSecs.add(k); else openSecs.delete(k); } }, true);
$('right').onclick = async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = DB.deals.find(x => x.DealID === cur);
  if (act === 'back') { cur = null; render(); }
  else if (act === 'save') saveDeal(changed(b.closest('.card'), d));
  else if (act === 'print') printForms(d, [...b.closest('.card').querySelectorAll('[data-form]:checked')].map(x => x.dataset.form));
  else if (act === 'verify') saveDeal({DocsVerified: b.dataset.v}, b.dataset.v ? 'Documents verified' : 'Verification removed');
  else if (act === 'status') {
    const v = b.dataset.v;
    if (v === 'Closed') { const x = done(d), p = CHIPS.filter(([k]) => k !== 'claims' && x[k] === false).map(c => c[1]); if (openClaims(d)) p.push('Claims');
      if (p.length && !confirm('Still pending: ' + p.join(', ') + '. Close anyway?')) return; }
    if (v === 'Cancelled' && !confirm('Cancel this booking?')) return;
    saveDeal({Status: v}, 'File ' + v.toLowerCase());
  }
  else if (act === 'stock') openStock();
  else if (act === 'upload') { upType = b.dataset.type; $('fileIn').click(); }
  else if (act === 'view') viewDoc(b.dataset.doc);
  else if (act === 'addClaim') run(async () => { const r = await jsonp('addClaim', {dealId: cur}); DB.claims.push(r.claim); render(); });
  else if (act === 'saveClaim') {
    const c = DB.claims.find(x => x.ClaimID === b.dataset.cid), f = changed(b.closest('.claim'), c);
    if (!Object.keys(f).length) return toast('Nothing changed');
    run(async () => { const r = await jsonp('updateClaim', {claimId: c.ClaimID, fields: f}); DB.claims[DB.claims.indexOf(c)] = r.claim; render(); toast('Claim saved'); });
  }
  else if (act === 'addPay') {
    const f = changed($('payNew'), {});
    run(async () => { const r = await jsonp('addPayment', {dealId: cur, fields: f}); DB.payments.push(r.payment); render(); toast('Payment added'); });
  }
  else if (act === 'savePay') {
    const p = DB.payments.find(x => x.PayID === b.dataset.pid), f = changed(b.closest('.claim'), p);
    if (!Object.keys(f).length) return toast('Nothing changed');
    run(async () => { const r = await jsonp('updatePayment', {payId: p.PayID, fields: f}); DB.payments[DB.payments.indexOf(p)] = r.payment; render(); toast('Payment corrected'); });
  }
  else if (act === 'create') {
    const data = changed($('newCard'), {});
    run(async () => { const r = await jsonp('createDeal', {data}); putDeal(r.deal); if (r.payment) DB.payments.push(r.payment); cur = r.deal.DealID; tab = 'all'; render(); toast('File ' + cur + ' opened'); });
  }
};
(function(){ if (window.__TEST) return; let p = ''; try { p = sessionStorage.getItem('dfpin') || ''; } catch (_) {} if (p) login(p); })();
