<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deal Files">
<meta name="theme-color" content="#eb0a1e">
<title>Planet Toyota - Deal Files</title>
<style>
:root{--red:#eb0a1e;--ink:#1c1c1e;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--ok:#15803d;--okbg:#dcfce7;--pd:#b45309;--pdbg:#fef3c7}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid #cfd3da;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}
input:disabled,select:disabled{background:#f1f2f4;color:#4b5563}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
label input,label select{margin-top:3px;font-size:15px}
label.ck{font-size:15px;color:var(--ink);margin-bottom:6px}
.hide{display:none!important}
#login{max-width:320px;margin:18vh auto 0;padding:24px;background:#fff;border-radius:14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#login h1{font-size:20px;margin:0 0 4px}#login p{color:var(--mut);margin:0 0 16px}
#login input{text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:12px}
#login button{width:100%}
header{background:var(--red);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.85;font-weight:400}
header button{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:6px 9px}
header button.new{background:#fff;color:var(--red);font-weight:700}
#main{display:grid;grid-template-columns:1fr;height:calc(100% - 52px)}
#left{overflow:auto;padding:10px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
#tabs button{white-space:nowrap;padding:6px 10px;font-size:13px}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tabs i{font-style:normal;opacity:.7;margin-left:4px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .nm{font-weight:600}.item .sub{color:var(--mut);font-size:13px}
.age{font-size:12px;color:var(--mut);white-space:nowrap}.age.old{color:var(--red);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--pdbg);color:var(--pd);font-weight:400}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.na{background:#eef0f3;color:var(--mut)}
#right{background:var(--bg);overflow:auto;padding:10px;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3,.card summary{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.card h3{margin-bottom:10px;cursor:default}
details.card[open] summary{margin-bottom:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mut);font-size:18px;margin-left:auto}
details[open]>summary::after{content:"–"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--mut);font-size:13px}
.doc{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-of-type{border-top:0}
.doc .t{flex:1;min-width:120px}.doc .miss{color:var(--red);font-size:12px;font-weight:600}
.doc button{padding:4px 9px;font-size:13px}
.claim{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.sum{background:#f8f9fb;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;line-height:1.7}
.sum b{white-space:nowrap}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%;text-align:center}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:25;display:flex;align-items:center;justify-content:center;font-weight:600}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewer img{max-width:100%;max-height:82vh;border-radius:6px}
#viewer a{color:#fff;font-size:17px}
#stockBox{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:flex;justify-content:center;align-items:flex-end}
#stockBox .sheet{background:#fff;width:100%;max-width:720px;height:88vh;border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:8px}
#stockBox .shead{display:flex;justify-content:space-between;align-items:center}
#stockL{overflow:auto;flex:1}
.st{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.st div{flex:1;min-width:0}.st .sub{color:var(--mut);font-size:12px;word-break:break-all}
@media (max-width:899px){
  #right{position:fixed;inset:0;top:calc(52px + env(safe-area-inset-top));z-index:4;display:none}
  #right.open{display:block}
}
@media (min-width:900px){
  #main{grid-template-columns:390px 1fr}
  #left{border-right:1px solid var(--line)}
  .back{display:none}
  .grid{grid-template-columns:1fr 1fr 1fr}
  #stockBox{align-items:center}#stockBox .sheet{border-radius:14px;height:80vh}
}

/* ---------- printed forms ---------- */
#print{display:none}
.pg{width:210mm;height:296mm;padding:11mm 13mm;position:relative;overflow:hidden;page-break-after:always;background:#fff;color:#000;font:10.5pt/1.4 Arial,"Nirmala UI","Noto Sans Devanagari",sans-serif}
.pg.img{padding:6mm}
.pg h1{font-size:14pt;text-align:center;margin:3mm 0 4mm;text-decoration:underline}
.pg h4{font-size:10.5pt;margin:3mm 0 1.5mm}
.pg p{margin:0 0 2.2mm}
.ov{position:relative;width:198mm}.ov img{width:100%;display:block}
.ov span{position:absolute;font:8.5pt/1 Arial,sans-serif;white-space:nowrap;transform:translateY(-55%)}
.lh{text-align:center;border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:2mm;line-height:1.3}
.lh .n{font:700 20pt Georgia,"Times New Roman",serif;letter-spacing:.5px}
.fl{display:inline-block;border-bottom:1px dotted #000;min-width:30mm;padding:0 1.5mm;font-weight:700;vertical-align:bottom;min-height:1.3em}
.ln{display:flex;gap:2mm;align-items:flex-end;margin-bottom:4.2mm}.ln .fl{flex:1}
.box{display:inline-block;width:9mm;height:5mm;border:1px solid #000;vertical-align:middle;text-align:center;line-height:5mm;font-weight:700;margin:0 6mm 0 2mm}
.pg table{border-collapse:collapse;width:100%}
.pg td,.pg th{border:1px solid #000;padding:.9mm 1.5mm;font-size:8.8pt;height:5.6mm}
.bo td{height:5.05mm;padding:.4mm 1.5mm;font-size:8.3pt}.bo td:nth-child(odd){text-align:center;width:23%;white-space:nowrap}.bo td:nth-child(even){font-weight:700;width:27%}
.bo .hd{font-weight:700;text-decoration:underline;text-align:center}
.kv.big td{font-size:10.5pt;height:8mm}.kv td:nth-child(odd){width:20%;background:#f2f2f2}.kv td:nth-child(even){width:30%;font-weight:700}
.sig{display:flex;justify-content:space-between;gap:8mm;position:absolute;left:13mm;right:13mm;bottom:14mm;font-size:9.5pt}.sig.flow{position:static;margin-top:15mm}
.sig div{flex:1;border-top:1px solid #000;padding-top:1.5mm;text-align:center}
.hi{font-size:10.5pt;line-height:1.75}.hi p{margin-bottom:2.6mm;text-align:justify}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
</style>
</head>
<body>

<div id="login">
  <h1>Planet Toyota</h1><p>Deal Files</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <button class="pri" id="loginBtn">Login</button>
</div>

<div id="app" class="hide">
  <header>
    <b>Deal Files <small id="who"></small></b>
    <button class="new" id="newBtn">+ New</button>
    <button id="stockBtn">Stock</button>
    <button id="refBtn">Refresh</button>
    <button id="outBtn">Logout</button>
  </header>
  <div id="main">
    <div id="left">
      <div id="tabs"></div>
      <div class="filters">
        <input id="q" placeholder="Search name, mobile, chassis, file no.">
        <select id="seF" style="max-width:150px"></select>
      </div>
      <div id="list"></div>
    </div>
    <div id="right"><div class="empty">Select a file</div></div>
  </div>
</div>

<input type="file" id="fileIn" accept="image/*,application/pdf" class="hide">
<datalist id="models"><option>Glanza<option>Urban Cruiser Taisor<option>Rumion<option>Urban Cruiser Hyryder<option>Innova Crysta<option>Innova Hycross<option>Fortuner<option>Legender<option>Hilux<option>Camry<option>Vellfire<option>Land Cruiser 300</datalist>
<datalist id="ctypes"><option>Exchange bonus<option>Loyalty bonus<option>Corporate discount<option>Consumer offer<option>Other</datalist>
<div id="viewer" class="hide"></div>
<div id="stockBox" class="hide"><div class="sheet">
  <div class="shead"><b id="stockT">Stock</b><button id="stockX">Close</button></div>
  <input id="stockQ" placeholder="Search model, variant, colour, chassis">
  <div id="stockL"></div>
</div></div>
<div id="busy" class="hide">Please wait…</div>
<div id="toast" class="hide"></div>
<div id="print"></div>

/* ---------- transport ---------- */
function jsonp(action, data){
  return new Promise((res, rej) => {
    const cb = 'cb' + Date.now() + Math.floor(Math.random()*1e6), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('Server did not respond')); }, 45000);
    window[cb] = r => { done(); r && r.ok ? res(r) : rej(new Error((r && r.error) || 'Error')); };
    s.onerror = () => { done(); rej(new Error('Network error')); };
    s.src = API + '?action=' + action + '&callback=' + cb + '&nonce=' + Date.now() +
      '&payload=' + encodeURIComponent(JSON.stringify(Object.assign({pin: PIN}, data || {})));
    document.body.appendChild(s);
  });
}
async function post(action, data){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, pin: PIN}, data))});
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Error'); e.server = true; throw e; }
  return j;
}
// Second route for uploads when the browser blocks the direct request: an ordinary form post into a hidden frame.
function formPost(action, data){
  let fr = $('upFrame');
  if (!fr) { fr = document.createElement('iframe'); fr.id = fr.name = 'upFrame'; fr.style.display = 'none'; document.body.appendChild(fr); }
  const f = document.createElement('form'), i = document.createElement('input');
  f.method = 'POST'; f.action = API; f.target = 'upFrame'; f.style.display = 'none';
  i.type = 'hidden'; i.name = 'payload'; i.value = JSON.stringify(Object.assign({action, pin: PIN}, data));
  f.appendChild(i); document.body.appendChild(f); f.submit(); f.remove();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function run(fn){ busy(true); try { return await fn(); } catch(e){ toast(e.message); } finally { busy(false); } }

/* ---------- status and money logic ---------- */
// Rent Agreement is needed when the temporary address differs from the permanent one; Finance DO when the vehicle is financed.
const rented = d => !!(d.TempAddress || '').trim() && d.TempAddress.trim() !== (d.Address || '').trim();
function reqDocs(d){ const r=['Aadhaar','PAN / Form 60']; if(fin(d))r.push('Finance DO'); if(rented(d))r.push('Rent Agreement'); return r; }
const docsOf = id => DB.docs.filter(x => x.DealID === id);
const paysOf = id => DB.payments.filter(x => x.DealID === id);
function missing(d){ const have=new Set(docsOf(d.DealID).map(x=>x.Type)); return reqDocs(d).filter(t=>!have.has(t)); }
function done(d){ return {prop: dlr(d) ? d.PropStatus === 'Signed' : null, sub: !!d.SubmittedAt || !!d.InvoiceNo, docs: !missing(d).length && d.DocsVerified==='Yes', bill: !!d.InvoiceNo, del: !!d.DeliveryDate,
  ew: d.EW==='Yes' ? !!d.EWNo : null, acc: d.Accessories==='Yes' ? !!d.AccInvoiceNo : null, tg: d.TGloss==='Yes' ? !!d.TGlossNo : null}; }
function inTab(d, t){
  const open = d.Status === 'Open';
  if (t === 'closed') return !open;
  if (!open) return false;
  const x = done(d);
  if (t === 'prop') return d.PropStatus === 'Requested';
  if (t === 'draft') return !x.sub;
  if (t === 'bill') return x.sub && !x.bill;
  return t === 'all' || x[t] === false;
}
function age(d){ const n=Math.floor((Date.now()-new Date((d.CreatedAt||'').slice(0,10)).getTime())/864e5); return isNaN(n)?0:Math.max(0,n); }
function canEdit(k, d){
  if (d.Status !== 'Open' && !isBack() && !isVas()) return false;
  const locked = !!(d.InvoiceNo || d.SubmittedAt) && !isBack();   // once submitted, only the billing desk can change sales details
  if (SALES_F.includes(k)) {
    if (locked && !DELIV_F.includes(k)) return false;
    if (k === 'ExShowroom' && d.PriceSource === 'Price list' && !isBack()) return false;
    if (k === 'InsAmt' && dlr(d)) return false;   // set by the insurance proposal
    return U.role !== 'SE' || d.SE === U.name;
  }
  if (ALLOT_F.includes(k)) return !locked && U.role !== 'CLAIMS' && (U.role !== 'SE' || d.SE === U.name);
  if (VAS_F.includes(k)) return isVas();
  return isBack();
}
// Net price = ex-showroom - discount. TCS applies when ex-showroom >= 10,00,000: 1% of ex-showroom when PAN and
// Aadhaar are linked, 5% when they are not linked or the customer has no PAN (FORM60).
// EPC = 1% of ex-showroom when ticked. Total = net price + TCS + EPC + all other charges.
// The old car in an exchange counts as a payment received. Received = payments + old car value.
// Net balance = total - finance disbursed - received.
// Payment status compares payments + old car + finance disbursed with the total.
const noPan = v => (v.PAN || '').toUpperCase().replace(/\s/g, '') === 'FORM60';
function calc(v){
  const ex = num(v.ExShowroom), net = ex - num(v.Discount);
  const rate = v.LinkStatus === 'Not linked' || noPan(v) ? 5 : 1;
  const tcs = ex >= 1000000 ? Math.round(ex * rate / 100) : 0, epc = v.EPCApplicable === 'Yes' ? Math.round(ex * 0.01) : 0;
  const other = ['EWAmt','InsAmt','RegCharges','AccAmt','TGlossAmt','Fastag','HSRPGarnish','TsmileAmt','OtherCharges'].reduce((a,k) => a + num(v[k]), 0);
  const total = net + tcs + epc + other, loan = fin(v) ? num(v.NetDisbursed) : 0, old = exc(v) ? num(v.OldCarValue) : 0;
  const cash = paysOf(v.DealID).reduce((a,p) => a + num(p.Amount), 0), paid = cash + old, rec = paid + loan;
  const status = rec <= 0 ? 'Pending' : total > 0 && rec >= total ? 'Full received' : 'Less received';
  return {ex, net, rate, tcs, epc, total, loan, old, cash, paid, status, due: total - loan - paid};
}
function sumHtml(v){
  const c = calc(v);
  return `${v.PriceSource === 'Price list' ? 'Ex-showroom price is from the price list<br>' : ''}Net price (ex-showroom − discount) <b>${rs(c.net)}</b><br>TCS @ ${c.rate}% <b>${c.tcs ? rs(c.tcs) : 'Not applicable (below ₹10,00,000)'}</b>${c.tcs ? (noPan(v) ? ' (no PAN)' : v.LinkStatus === 'Not linked' ? ' (PAN and Aadhaar not linked)' : v.LinkStatus === 'Linked' ? ' (PAN and Aadhaar linked)' : ' <span class="miss">Link status not checked; 1% assumed</span>') : ''}<br>EPC @ 1% <b>${c.epc ? rs(c.epc) : 'Not applicable'}</b><br>
    <span style="font-size:16px">Total amount <b>${rs(c.total)}</b></span><br>Finance disbursed <b>${rs(c.loan)}</b> · Received <b>${rs(c.paid)}</b>${c.old ? ' (payments ' + rs(c.cash) + ' + old car ' + rs(c.old) + ')' : ''}<br>Net balance <b>${rs(c.due)}</b> · Payment status <b>${c.status}</b>`;
}
// A new file picks its vehicle from uninvoiced stock that is not allotted to another file.
const freeStock = () => STOCK.filter(s => !s.AllottedTo);
const sVar = s => s.Variant || s.Model;
const vehLabel = s => sVar(s) + ' · ' + s.Colour + ' · ' + s.Chassis;
function vehSearch(wrap){   // list stock vehicles matching every typed word
  const words = wrap.querySelector('[data-vq]').value.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = freeStock().filter(s => words.every(w => vehLabel(s).toLowerCase().includes(w)));
  wrap.querySelector('[data-vlist]').innerHTML = hits.slice(0, 40).map(s => `<div class="st" data-vpick="${esc(s.Chassis)}" style="cursor:pointer"><div><b>${esc(sVar(s))}</b> · ${esc(s.Colour)}<div class="sub">${esc(s.Chassis)}</div></div></div>`).join('') + (hits.length > 40 ? `<p class="mut">${hits.length - 40} more. Type more to narrow down.</p>` : '') || '<p class="mut">No vehicle found in stock</p>';
}

function visible(){
  const q = $('q').value.trim().toLowerCase(), se = $('seF').value;
  return DB.deals.filter(d => inTab(d, tab) && (!se || d.SE === se) &&
    (!q || [d.Customer,d.Mobile,d.Chassis,d.DealID,d.Model,d.Variant].join(' ').toLowerCase().includes(q)))
    .sort((a,b) => age(b) - age(a));
}
function render(){
  const se = $('seF').value;
  $('tabs').innerHTML = TABS.map(([k,t]) => `<button data-tab="${k}" class="${k===tab?'on':''}">${t}<i>${DB.deals.filter(d=>inTab(d,k)&&(!se||d.SE===se)).length}</i></button>`).join('');
  const rows = visible();
  $('list').innerHTML = rows.length ? rows.map(d => {
    const x = done(d), a = age(d);
    const chips = CHIPS.map(([k,t]) => `<span class="chip ${x[k] == null ? 'na' : x[k] ? 'ok' : ''}">${t}</span>`).join('');
    return `<div class="item ${d.DealID===cur?'sel':''}" data-id="${esc(d.DealID)}">
      <div class="top"><span class="nm">${esc(d.Customer)}</span><span class="age ${a>15&&d.Status==='Open'?'old':''}">${d.Status==='Open'?a+' d':esc(d.Status)}</span></div>
      <div class="sub">${esc(d.Variant || d.Model)} · ${esc(d.SE)} · ${esc(d.DealID)}</div>
      <div class="chips">${chips}</div></div>`;
  }).join('') : '<div class="empty">No files here</div>';
  renderDetail();

async function load(){

  if (st.stock) STOCK = st.stock; else toast('Stock list not loaded: ' + st.err);
  const ses = [...new Set(DB.deals.map(d => d.SE))].sort(), keep = $('seF').value;
  $('seF').innerHTML = '<option value="">All SEs</option>' + ses.map(s => `<option ${s===keep?'selected':''}>${esc(s)}</option>`).join('');
  $('seF').classList.toggle('hide', U.role === 'SE');

function putDeal(d){ const i = DB.deals.findIndex(x => x.DealID === d.DealID); if (i >= 0) DB.deals[i] = d; else DB.deals.push(d); }
function changed(box, base){
  const f = {};
  box.querySelectorAll('[data-k]').forEach(el => {
    if (el.disabled) return;
    const v = el.type === 'checkbox' ? (el.checked ? 'Yes' : '') : el.value.trim();
    if (v !== (base[el.dataset.k] || '')) f[el.dataset.k] = v;
  });
  return f;
}

function prep(file){
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) {
      if (file.type !== 'application/pdf') return rej(new Error('Only photos and PDFs can be uploaded'));
      if (file.size > 4e6) return rej(new Error('PDF is larger than 4 MB'));
      const r = new FileReader();
      r.onload = () => res({mime: 'application/pdf', b64: r.result.split(',')[1]});
      r.onerror = () => rej(new Error('Could not read file'));
      return r.readAsDataURL(file);
    }
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res({mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.75).split(',')[1]});
    };
    img.onerror = () => rej(new Error('Could not read this photo'));
    img.src = u;
  });
}
async function doUpload(file){
  const id = cur, type = upType;
  await run(async () => {
    const p = await prep(file), before = docsOf(id).filter(x => x.Type === type).length;
    let err = null;
    const body = {dealId: id, type, mime: p.mime, b64: p.b64}, count = () => docsOf(id).filter(x => x.Type === type).length;
    try { await post('upload', body); } catch (e) { err = e; }
    await load();
    if (count() <= before && err && !err.server) {   // the direct request was blocked: use the form route and wait for the file to appear
      formPost('upload', body);
      for (let n = 0; n < 5 && count() <= before; n++) { await sleep(4000); await load(); }
    }
    if (count() > before) toast(type + ' uploaded'); else throw new Error('Upload failed' + (err ? ': ' + err.message : ''));
  });
}
async function viewDoc(docId){
  await run(async () => {
    const r = await jsonp('file', {docId});
    const bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: r.mime}));
    const V = $('viewer');
    V.innerHTML = (r.mime.startsWith('image/') ? `<img src="${url}" alt="">` : `<a href="${url}" target="_blank" rel="noopener">Open PDF: ${esc(r.name)}</a>`) + `<button data-close="1">Close</button>`;
    V.dataset.url = url; V.classList.remove('hide');
  });
}

    const miss = missingForPrint(curDeal());
    if (miss.length) return alert('Complete these before submitting to billing:\n\n- ' + miss.join('\n- '));
    if (!confirm('Submit this file to the billing department? You will not be able to change it afterwards.')) return;
    putDeal((await jsonp('submit', {id: cur})).deal); render(); toast('File submitted to the billing department');
  });
  else if (act === 'sendBack') {
    const note = prompt('What does sales have to correct?');
    if (!note || !note.trim()) return;
    run(async () => { putDeal((await jsonp('sendBack', {id: cur, note})).deal); cur = null; await load(); toast('File sent back to sales'); });
  }
  else if (act === 'stock') openStock();
  else if (act === 'checkLink') {
    if (!d.PAN || !d.Aadhaar) return toast('Enter PAN and Aadhaar number and save first');
    run(async () => { const r = await jsonp('checkLink', {id: cur}); putDeal(r.deal); render(); toast(r.decided ? 'PAN-Aadhaar: ' + r.deal.LinkStatus : 'Portal reply saved. Select the status yourself.'); });
  }
  else if (act === 'sync') run(async () => { const r = await jsonp('syncSheet', {id: cur}); putDeal(r.deal); render(); toast(r.deal.SheetSync); });
  else if (act === 'upload') { upType = b.dataset.type; $('fileIn').click(); }
  else if (act === 'view') viewDoc(b.dataset.doc);
  else if (act === 'addPay') {
    const f = changed($('payNew'), {});
    run(async () => { const r = await jsonp('addPayment', {dealId: cur, fields: f}); DB.payments.push(r.payment); render(); toast('Payment added'); });
  }
  else if (act === 'savePay') {
    const p = DB.payments.find(x => x.PayID === b.dataset.pid), f = changed(b.closest('.claim'), p);
    if (!Object.keys(f).length) return toast('Nothing changed');
    run(async () => { const r = await jsonp('updatePayment', {payId: p.PayID, fields: f}); DB.payments[DB.payments.indexOf(p)] = r.payment; render(); toast('Payment corrected'); });
  }
  else if (act === 'create') {
    const data = changed($('newCard'), {}), s = STOCK.find(x => x.Chassis === data.Chassis);
    if (!s) return toast('Select the vehicle from stock');
    Object.assign(data, {EngineNo: s.EngineNo, Suffix: s.Suffix, MfgYear: s.MfgYear, Model: s.Model, Variant: sVar(s), Colour: s.Colour});
    run(async () => { const r = await jsonp('createDeal', {data}); putDeal(r.deal); cur = r.deal.DealID; tab = 'all'; render(); toast('File ' + cur + ' opened'); });
  }
};
(function(){ if (window.__TEST) return; let p = ''; try { p = sessionStorage.getItem('dfpin') || ''; } catch (_) {} if (p) login(p); })();
</script>
